<main><h1>Controle de despesas</h1><p class="muted">Registre gastos por categoria. Os dados ficam salvos no navegador.</p>
<section class="panel"><form (ngSubmit)="add()"><div class="row"><div class="field"><label for="desc">Descrição</label><input id="desc" name="desc" [(ngModel)]="description" placeholder="Ex.: Mercado" required></div><div class="field"><label for="category">Categoria</label><select id="category" name="category" [(ngModel)]="category">@for(c of categories;track c){<option [value]="c">{{c}}</option>}</select></div><div class="field"><label for="amount">Valor (R$)</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" [(ngModel)]="amount" required></div></div><button style="margin-top:14px" type="submit">Adicionar despesa</button></form></section>
<section class="panel"><div class="stats"><div class="stat"><strong>{{money(total())}}</strong>Total registrado</div><div class="stat"><strong>{{expenses().length}}</strong>Lançamentos</div></div></section>
<section class="panel"><div class="row"><h2 style="margin-right:auto">Histórico</h2><label for="category-filter">Filtrar</label><select id="category-filter" [ngModel]="selectedCategory()" (ngModelChange)="selectedCategory.set($event)"><option value="Todas">Todas</option>@for(c of categories;track c){<option [value]="c">{{c}}</option>}</select></div>
@for(e of filtered();track e.id){<div class="item"><div><strong>{{e.description}}</strong><div class="muted">{{e.category}}</div></div><div class="row"><strong>{{money(e.value)}}</strong><button class="danger" (click)="remove(e.id)">Excluir</button></div></div>} @empty {<p class="muted">Nenhuma despesa cadastrada.</p>}</section></main>
